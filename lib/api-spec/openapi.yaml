openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: support
    description: Support ticketing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /support/products:
    get:
      operationId: listPublicSupportProducts
      tags: [support]
      summary: List active, publicly visible support products
      description: Returns the list of active and publicly visible products that public users can report problems against.
      responses:
        "200":
          description: List of public products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicSupportProduct"

  /support/tickets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: Get a single support ticket (Eride org only)
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSupportTicket
      tags: [support]
      summary: Update mutable fields of a support ticket (Eride org only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/notes:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSupportTicketNotes
      tags: [support]
      summary: List internal notes for a ticket (newest first)
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketNote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSupportTicketNote
      tags: [support]
      summary: Add an internal note to a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketNoteCreate"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketNote"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/status-history:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSupportTicketStatusHistory
      tags: [support]
      summary: List status change history for a ticket (newest first)
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketStatusHistoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/linear-link:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSupportTicketLinearLink
      tags: [support]
      summary: Get the manually-recorded Linear link for a ticket
      responses:
        "200":
          description: Linear link or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SupportTicketLinearLink"
                  - type: "null"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: upsertSupportTicketLinearLink
      tags: [support]
      summary: Create or update the manually-linked Linear issue for a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketLinearLinkUpsert"
      responses:
        "200":
          description: Saved Linear link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketLinearLink"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSupportTicketLinearLink
      tags: [support]
      summary: Remove the Linear link for a ticket
      responses:
        "204":
          description: Deleted (or never existed)
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/sentry-links:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSupportTicketSentryLinks
      tags: [support]
      summary: List Sentry links recorded against a ticket (newest first)
      responses:
        "200":
          description: List of Sentry links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketSentryLink"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSupportTicketSentryLink
      tags: [support]
      summary: Manually record a Sentry issue/event link for a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketSentryLinkCreate"
      responses:
        "200":
          description: Created Sentry link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketSentryLink"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/sentry-links/{sentryLinkId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: sentryLinkId
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteSupportTicketSentryLink
      tags: [support]
      summary: Remove a Sentry link from a ticket
      responses:
        "204":
          description: Deleted
        "404":
          description: Ticket or Sentry link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Public-user ticket tracking endpoints (verify, view, messages, reply, attachments)
  # are intentionally NOT in this OpenAPI spec — they are called via plain `fetch` from
  # the public web pages and accept an HMAC-signed access token. Keeping them out of
  # codegen avoids generating React Query hooks the public pages should not be using
  # (e.g. accidental cache sharing with the admin app).

  /support/tickets/{id}/send-email:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendSupportTicketEmail
      tags: [support]
      summary: Send a support email for a ticket and log it as an outbound message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketEmailSendRequest"
      responses:
        "200":
          description: Email send result (success, failure, or disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSupportTicketEmailResult"
        "400":
          description: Validation error or missing recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/workflow-action:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: applySupportTicketWorkflowAction
      tags: [support]
      summary: Apply a named workflow shortcut to a support ticket
      description: Sets public/internal status (and resolvedAt/closedAt) for the named action and writes a status-history row. Eride org only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketWorkflowActionRequest"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSupportTicketMessages
      tags: [support]
      summary: List communication records for a ticket (newest first)
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSupportTicketMessage
      tags: [support]
      summary: Record a communication for a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketMessageCreate"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketMessage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/attachments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSupportTicketAttachments
      tags: [support]
      summary: List attachments for a support ticket (newest first)
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketAttachment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadSupportTicketAttachment
      tags: [support]
      summary: Upload an attachment to a support ticket
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SupportTicketAttachmentUpload"
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketAttachment"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/attachments/{attachmentId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: attachmentId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSupportTicketAttachment
      tags: [support]
      summary: Stream/download an attachment
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSupportTicketAttachment
      tags: [support]
      summary: Delete an attachment
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/settings:
    get:
      operationId: getSupportSettings
      tags: [support]
      summary: Get current support settings (Eride org)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSettings"
    patch:
      operationId: updateSupportSettings
      tags: [support]
      summary: Update support settings (Eride org)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/templates:
    get:
      operationId: listSupportMessageTemplates
      tags: [support]
      summary: List support message templates (Eride org)
      parameters:
        - in: query
          name: channel
          required: false
          schema: { $ref: "#/components/schemas/SupportTemplateChannel" }
        - in: query
          name: templateKey
          required: false
          schema: { $ref: "#/components/schemas/SupportTemplateKey" }
        - in: query
          name: isActive
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportMessageTemplate" }

  /support/templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSupportMessageTemplate
      tags: [support]
      summary: Get a single template
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessageTemplate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSupportMessageTemplate
      tags: [support]
      summary: Update a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessageTemplate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/templates/preview:
    post:
      operationId: previewSupportMessageTemplate
      tags: [support]
      summary: Render a template against a real or sample ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageTemplatePreviewRequest"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewSupportMessageTemplateResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/wallboard:
    get:
      operationId: getSupportWallboard
      tags: [support]
      summary: Live support wallboard data for the Eride organisation
      description: Aggregated counts, product breakdown, and watchlists for the office wallboard. Eride org only.
      responses:
        "200":
          description: Wallboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportWallboard"

  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List support tickets for the Eride organisation (internal admin)
      description: Returns support tickets, with optional filters and search. Newest first.
      parameters:
        - in: query
          name: productId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: productCode
          required: false
          schema: { type: string }
        - in: query
          name: category
          required: false
          schema: { $ref: "#/components/schemas/SupportTicketCategory" }
        - in: query
          name: publicStatus
          required: false
          schema: { $ref: "#/components/schemas/PublicSupportTicketStatus" }
        - in: query
          name: internalStatus
          required: false
          schema: { $ref: "#/components/schemas/InternalSupportTicketStatus" }
        - in: query
          name: priority
          required: false
          schema: { $ref: "#/components/schemas/SupportTicketPriority" }
        - in: query
          name: severity
          required: false
          schema: { $ref: "#/components/schemas/SupportTicketSeverity" }
        - in: query
          name: source
          required: false
          schema: { type: string }
        - in: query
          name: reporterType
          required: false
          schema: { $ref: "#/components/schemas/SupportReporterType" }
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: createdFrom
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: createdTo
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketListItem"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Submit a support ticket from the public report-a-problem form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketSubmission"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSupportTicket"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found or not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PublicSupportProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productCode:
          type: string
        productName:
          type: string
        productDescription:
          type: ["string", "null"]
      required:
        - id
        - productCode
        - productName

    SupportTicketCategory:
      type: string
      enum:
        - technical_bug
        - account_login_issue
        - otp_verification_issue
        - document_upload_issue
        - application_flow_confusion
        - payment_issue
        - b2b_firm_admin_issue
        - consultant_issue
        - partner_issue
        - feature_request
        - complaint
        - data_correction_request
        - security_privacy_concern
        - performance_issue
        - system_downtime
        - general_support

    SupportReporterType:
      type: string
      enum:
        - public_visitor
        - applicant
        - b2b_firm_admin
        - consultant
        - beauty_client
        - beauty_professional
        - partner
        - internal_tester
        - other

    PublicSupportTicketStatus:
      type: string
      enum:
        - received
        - under_review
        - more_info_needed
        - being_fixed
        - fixed
        - resolved
        - closed

    SupportTicketSubmission:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        reporterName:
          type: string
          minLength: 1
        reporterEmail:
          type: ["string", "null"]
        reporterWhatsapp:
          type: ["string", "null"]
        reporterType:
          $ref: "#/components/schemas/SupportReporterType"
        category:
          $ref: "#/components/schemas/SupportTicketCategory"
        pageOrStep:
          type: ["string", "null"]
        applicationReference:
          type: ["string", "null"]
        accountReference:
          type: ["string", "null"]
        issueSummary:
          type: string
          minLength: 1
        whatWereYouTryingToDo:
          type: ["string", "null"]
        whatWentWrong:
          type: string
          minLength: 1
        deviceType:
          type: ["string", "null"]
        browser:
          type: ["string", "null"]
        canContact:
          type: boolean
          default: true
      required:
        - productId
        - reporterName
        - reporterType
        - category
        - issueSummary
        - whatWentWrong

    SupportTicketPriority:
      type: string
      enum: [urgent, high, medium, low]

    SupportTicketSeverity:
      type: string
      enum: [critical, major, moderate, minor, cosmetic]

    InternalSupportTicketStatus:
      type: string
      enum:
        - new
        - triage_required
        - support_review
        - needs_user_info
        - engineering_escalation_required
        - linear_created
        - in_engineering
        - in_review
        - in_qa_verification
        - fixed_waiting_user_notification
        - user_notified
        - resolved
        - closed
        - duplicate
        - not_a_bug
        - deferred
        - spam

    SupportWallboardSummary:
      type: object
      properties:
        totalOpenTickets: { type: integer }
        urgentTickets: { type: integer }
        highPriorityTickets: { type: integer }
        awaitingTriage: { type: integer }
        needsUserInfo: { type: integer }
        engineeringEscalationRequired: { type: integer }
        inEngineering: { type: integer }
        inQaVerification: { type: integer }
        fixedWaitingUserNotification: { type: integer }
        slaBreachedPlaceholder: { type: integer }
        closedToday: { type: integer }
        resolvedToday: { type: integer }
      required:
        - totalOpenTickets
        - urgentTickets
        - highPriorityTickets
        - awaitingTriage
        - needsUserInfo
        - engineeringEscalationRequired
        - inEngineering
        - inQaVerification
        - fixedWaitingUserNotification
        - slaBreachedPlaceholder
        - closedToday
        - resolvedToday

    SupportWallboardProductBreakdown:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        productCode: { type: string }
        openTickets: { type: integer }
        urgentTickets: { type: integer }
        highPriorityTickets: { type: integer }
        awaitingTriage: { type: integer }
        resolvedToday: { type: integer }
      required:
        - productId
        - productName
        - productCode
        - openTickets
        - urgentTickets
        - highPriorityTickets
        - awaitingTriage
        - resolvedToday

    SupportWallboardTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticketReference: { type: string }
        productName: { type: string }
        productCode: { type: string }
        issueSummary: { type: string }
        priority: { $ref: "#/components/schemas/SupportTicketPriority" }
        severity: { $ref: "#/components/schemas/SupportTicketSeverity" }
