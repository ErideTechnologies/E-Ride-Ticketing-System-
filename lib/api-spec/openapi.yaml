openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: support
    description: Support ticketing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /support/products:
    get:
      operationId: listPublicSupportProducts
      tags: [support]
      summary: List active, publicly visible support products
      description: Returns the list of active and publicly visible products that public users can report problems against.
      responses:
        "200":
          description: List of public products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicSupportProduct"

  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List support tickets for the Eride organisation (internal admin)
      description: Returns support tickets, with optional filters and search. Newest first.
      parameters:
        - in: query
          name: productId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: productCode
          required: false
          schema: { type: string }
        - in: query
          name: category
          required: false
          schema: { $ref: "#/components/schemas/SupportTicketCategory" }
        - in: query
          name: publicStatus
          required: false
          schema: { $ref: "#/components/schemas/PublicSupportTicketStatus" }
        - in: query
          name: internalStatus
          required: false
          schema: { $ref: "#/components/schemas/InternalSupportTicketStatus" }
        - in: query
          name: priority
          required: false
          schema: { $ref: "#/components/schemas/SupportTicketPriority" }
        - in: query
          name: severity
          required: false
          schema: { $ref: "#/components/schemas/SupportTicketSeverity" }
        - in: query
          name: source
          required: false
          schema: { type: string }
        - in: query
          name: reporterType
          required: false
          schema: { $ref: "#/components/schemas/SupportReporterType" }
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: createdFrom
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: createdTo
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketListItem"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Submit a support ticket from the public report-a-problem form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketSubmission"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSupportTicket"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found or not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PublicSupportProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productCode:
          type: string
        productName:
          type: string
        productDescription:
          type: ["string", "null"]
      required:
        - id
        - productCode
        - productName

    SupportTicketCategory:
      type: string
      enum:
        - technical_bug
        - account_login_issue
        - otp_verification_issue
        - document_upload_issue
        - application_flow_confusion
        - payment_issue
        - b2b_firm_admin_issue
        - consultant_issue
        - partner_issue
        - feature_request
        - complaint
        - data_correction_request
        - security_privacy_concern
        - performance_issue
        - system_downtime
        - general_support

    SupportReporterType:
      type: string
      enum:
        - public_visitor
        - applicant
        - b2b_firm_admin
        - consultant
        - beauty_client
        - beauty_professional
        - partner
        - internal_tester
        - other

    PublicSupportTicketStatus:
      type: string
      enum:
        - received
        - under_review
        - more_info_needed
        - being_fixed
        - fixed
        - resolved
        - closed

    SupportTicketSubmission:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        reporterName:
          type: string
          minLength: 1
        reporterEmail:
          type: ["string", "null"]
        reporterWhatsapp:
          type: ["string", "null"]
        reporterType:
          $ref: "#/components/schemas/SupportReporterType"
        category:
          $ref: "#/components/schemas/SupportTicketCategory"
        pageOrStep:
          type: ["string", "null"]
        applicationReference:
          type: ["string", "null"]
        accountReference:
          type: ["string", "null"]
        issueSummary:
          type: string
          minLength: 1
        whatWereYouTryingToDo:
          type: ["string", "null"]
        whatWentWrong:
          type: string
          minLength: 1
        deviceType:
          type: ["string", "null"]
        browser:
          type: ["string", "null"]
        canContact:
          type: boolean
          default: true
      required:
        - productId
        - reporterName
        - reporterType
        - category
        - issueSummary
        - whatWentWrong

    SupportTicketPriority:
      type: string
      enum: [urgent, high, medium, low]

    SupportTicketSeverity:
      type: string
      enum: [critical, major, moderate, minor, cosmetic]

    InternalSupportTicketStatus:
      type: string
      enum:
        - new
        - triage_required
        - support_review
        - needs_user_info
        - engineering_escalation_required
        - linear_created
        - in_engineering
        - in_review
        - in_qa_verification
        - fixed_waiting_user_notification
        - user_notified
        - resolved
        - closed
        - duplicate
        - not_a_bug
        - deferred
        - spam

    SupportTicketListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticketReference: { type: string }
        productName: { type: string }
        productCode: { type: string }
        category: { $ref: "#/components/schemas/SupportTicketCategory" }
        publicStatus: { $ref: "#/components/schemas/PublicSupportTicketStatus" }
        internalStatus: { $ref: "#/components/schemas/InternalSupportTicketStatus" }
        priority: { $ref: "#/components/schemas/SupportTicketPriority" }
        severity: { $ref: "#/components/schemas/SupportTicketSeverity" }
        reporterType: { $ref: "#/components/schemas/SupportReporterType" }
        reporterName: { type: string }
        reporterEmail: { type: string }
        reporterWhatsapp: { type: ["string", "null"] }
        issueSummary: { type: string }
        source: { type: string }
        environment: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - ticketReference
        - productName
        - productCode
        - category
        - publicStatus
        - internalStatus
        - priority
        - severity
        - reporterType
        - reporterName
        - reporterEmail
        - issueSummary
        - source
        - createdAt
        - updatedAt

    CreatedSupportTicket:
      type: object
      properties:
        ticketReference:
          type: string
        publicStatus:
          $ref: "#/components/schemas/PublicSupportTicketStatus"
        productName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - ticketReference
        - publicStatus
        - productName
        - createdAt
